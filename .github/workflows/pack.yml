name: Pack

# Every push and PR packs BinaryVibrance.Lunelle, with its music generator. A push to master also publishes a test build
# to GitHub Packages (the project's version, then .ci.<run>), built on Sirrow's master beside it. A v* tag publishes the
# release to nuget.org, versioned by the tag (v0.1.0-preview.2 packs 0.1.0-preview.2), built on the released Sirrow that
# Directory.Packages.props pins (SirrowSource none), so its dependency names a Sirrow that exists: release that Sirrow
# first, then move the pin.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # test builds, to GitHub Packages
  id-token: write   # releases: nuget.org's trusted publishing, a short-lived key from GitHub's OIDC token

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      TEST_BUILD: ${{ github.ref == 'refs/heads/master' }}
    steps:
      # With Git LFS: the library's sampled kits are audio kept there, which the package carries
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Check out Sirrow beside Lunelle
        if: env.RELEASE != 'true'
        run: |
          rm -rf ../Sirrow
          git clone --depth 1 https://github.com/AtomicBlom/Sirrow.git ../Sirrow

      - name: Choose the version
        shell: bash
        run: |
          if [ "$RELEASE" = "true" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "SIRROW=-p:SirrowSource=none" >> "$GITHUB_ENV"
          else
            version="$(dotnet msbuild BinaryVibrance.Lunelle/BinaryVibrance.Lunelle.csproj -getProperty:Version).ci.${{ github.run_number }}"
          fi
          echo "Packing $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # LunelleVersion, not Version: a global Version would reach Sirrow's project too, and Lunelle's dependency would name
      # a Sirrow at Lunelle's version. Sirrow's checkout keeps its own (its Version.props).
      # A package of pointers would play nothing: refuse one where any of the library's audio is still a pointer
      - name: Check the library's audio is real
        shell: bash
        run: |
          pointers="$(grep -rlI '^version https://git-lfs' BinaryVibrance.Lunelle/Library || true)"
          if [ -n "$pointers" ]; then echo "Git LFS pointers, not audio:"; echo "$pointers"; exit 1; fi

      - name: Pack
        shell: bash
        run: |
          dotnet build BinaryVibrance.Lunelle.Music.Generator/BinaryVibrance.Lunelle.Music.Generator.csproj -c Release
          dotnet pack BinaryVibrance.Lunelle/BinaryVibrance.Lunelle.csproj -c Release -o artifacts/packages "-p:LunelleVersion=$VERSION" $SIRROW
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg

      - name: Publish the test build to GitHub Packages
        if: env.TEST_BUILD == 'true'
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/AtomicBlom/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Log in to nuget.org
        if: env.RELEASE == 'true'
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish the release to nuget.org
        if: env.RELEASE == 'true'
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --skip-duplicate
