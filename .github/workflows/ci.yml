name: CI

# Lunelle, its generator and its sample build warning-clean and the tests pass. Nothing here needs a GPU, a window or an
# output device (the tests render offline), so a hosted Linux runner does it all.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sirrow, which Lunelle builds on, from a checkout beside this one (..\Sirrow, where build/Sirrow.Source.props
      # looks): its master branch. A change here that needs one there passes once that one is merged.
      - name: Check out Sirrow beside Lunelle
        run: |
          rm -rf ../Sirrow
          git clone --depth 1 https://github.com/AtomicBlom/Sirrow.git ../Sirrow

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Build
        run: dotnet build BinaryVibrance.Lunelle.slnx -c Release
      - name: Test
        run: dotnet test --project BinaryVibrance.Lunelle.Tests/BinaryVibrance.Lunelle.Tests.csproj -c Release --no-build
